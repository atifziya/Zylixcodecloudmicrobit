<script type="text/javascript">
window.addEventListener("DOMContentLoaded", () => {
    let hidden = false;
    
    // Observe the rootdir to see if we are in the homescreen or not. If
    // we leave the home screen, hide the usabilla overlay
    const observer = new MutationObserver((mutationList) => {
        for (const mutation of mutationList) {
            if (mutation.type === "attributes") {
                const root = document.getElementById("root");

                if (root.classList.contains("inHome")) {
                    if (hidden) {
                        hidden = false;
                        const el = document.querySelector("div.usabilla__overlay");
                        if (el) el.style.display = "";
                    }
                }
                else if (!hidden) {
                    hidden = true;
                    const el = document.querySelector("div.usabilla__overlay");
                    if (el) el.style.display = "none";
                }
            }
        }
    });

    // Just poll until react has had time to render the root div
    let interval = setInterval(() => {
        const root = document.getElementById("root");

        if (root) {
            clearInterval(interval);
            observer.observe(root, { attributes: true, attributeFilter: ["class"] });
        }
    }, 500);
});
</script>
<script>
(function() {
    var EXTERNAL_URL = 'https://www.zylixcodecloud.in/';

    // 1. Override PXT's internal config directly
    function overrideConfig() {
        if (window.pxt && window.pxt.appTarget && window.pxt.appTarget.appTheme) {
            window.pxt.appTarget.appTheme.homeUrl = EXTERNAL_URL;
            window.pxt.appTarget.appTheme.organizationUrl = EXTERNAL_URL;
            window.pxt.appTarget.appTheme.logoUrl = EXTERNAL_URL;
        }
    }

    // 2. Intercept ALL clicks (capture phase - beats React Router)
    document.addEventListener('click', function(e) {
        var target = e.target.closest('a[href]');
        if (!target) return;

        var href = target.getAttribute('href');
        var isLogo = target.closest('.logo') || target.closest('.ui.image.logo');
        var isHomeLink = (href && (href.includes('#home') || href.includes('home') || href === '#' || href === '/'));
        var isInMainMenu = target.closest('#mainmenu');

        // If it's the logo or home button in the main menu
        if ((isLogo || isHomeLink) && isInMainMenu) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = EXTERNAL_URL;
            return;
        }
    }, true); // capture phase

    // 3. MutationObserver to catch dynamically added logo links
    var observer = new MutationObserver(function() {
        overrideConfig();
        var logoLinks = document.querySelectorAll('#mainmenu .logo a, #mainmenu .ui.image.logo a');
        logoLinks.forEach(function(link) {
            link.href = EXTERNAL_URL;
        });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 4. Run on load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            overrideConfig();
        });
    } else {
        overrideConfig();
    }

    // 5. Extra: Periodically check if PXT resets the logo (PXT sometimes re-renders)
    setInterval(function() {
        var links = document.querySelectorAll('#mainmenu .logo a');
        links.forEach(function(link) {
            if (link.href && !link.href.includes('zylixcodecloud')) {
                link.href = EXTERNAL_URL;
            }
        });
    }, 1000);
})();
</script>
